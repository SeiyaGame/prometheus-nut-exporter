name: Dependabot auto-merge

# Minor and patch updates are queued for merge: GitHub merges them once the required
# checks pass (repository settings: "Allow auto-merge" + a rule on master requiring "CI ok").
# Major updates and GitHub Actions updates (they run with write permissions) stay open
# for a review.
#
# A merge done with GITHUB_TOKEN does not start the CI on master, so no dev pre-release
# would be built. AUTOMERGE_TOKEN (a Dependabot secret: fine-grained token with
# "Contents" and "Pull requests" read/write on this repository) avoids that.
on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
      - if: >-
          steps.meta.outputs.update-type != 'version-update:semver-major' &&
          steps.meta.outputs.package-ecosystem != 'github_actions'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.AUTOMERGE_TOKEN || secrets.GITHUB_TOKEN }}
