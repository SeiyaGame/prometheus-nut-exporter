# Weekly dependency updates. Minor and patch bumps are grouped into one PR per ecosystem
# and merged automatically once the CI passes (dependabot-automerge.yml), which publishes
# a new "dev" pre-release; majors get their own PR and wait for a review.
version: 2

updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Paris
    # Leave new releases a few days to get yanked before picking them up
    cooldown:
      default-days: 3
    commit-message:
      prefix: build
      include: scope
    groups:
      rust:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Paris
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Paris
    commit-message:
      prefix: build
      include: scope
    groups:
      docker:
        update-types: [minor, patch]
