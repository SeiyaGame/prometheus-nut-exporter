[package]
name = "prometheus-nut-exporter"
version = "0.0.0"
authors = ["HON95", "SeiyaGame"]
license = "GPL-3.0-only"
description = "A Prometheus exporter for Network UPS Tools (NUT)."
keywords = ["prometheus", "openmetrics", "nut", "exporter"]
homepage = "https://github.com/SeiyaGame/prometheus-nut-exporter"
repository = "https://github.com/SeiyaGame/prometheus-nut-exporter"
edition = "2024"
rust-version = "1.85"

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "query", "tokio"] }
env_logger = "0.11"
log = "0.4"
tokio = { version = "1.53.3", features = ["macros", "net", "rt-multi-thread", "signal", "time", "io-util"] }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"

[profile.release]
lto = true
codegen-units = 1
strip = true
